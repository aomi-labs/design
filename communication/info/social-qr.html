<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aomi — scan to connect</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --bg2:#fafafa; --panel:#ffffff; --panel2:#f4f4f5;
  --line:#e4e4e7; --line2:#d4d4d8;
  --ink:#09090b; --ink2:#3f3f46; --mut:#52525b; --dim:#71717a; --faint:#a1a1aa;
  --hl:#416cac; --hl2:#5288c2; --tint:#e2eef8; --tintline2:#cfe1f3;
  --somm:#df5d90; --sommtext:#c8527f; --sommtint:#fbe4ef; --sommline2:#f6cbdd;
  --sh-sm:0 1px 2px rgba(13,13,15,.04); --sh-md:0 4px 16px rgba(13,13,15,.06); --sh-lg:0 12px 40px rgba(13,13,15,.10);
  --sans:"Geist",ui-sans-serif,system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --serif:"PT Serif",ui-serif,Georgia,serif;
  --wm:"Source Serif 4",ui-serif,Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:var(--bg2);-webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:56px 24px}
.wrap{width:100%;max-width:900px}
.brand{font-family:var(--wm);font-weight:600;font-size:20px;letter-spacing:-.01em;color:var(--ink)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--hl);margin-top:28px}
h1{font-family:var(--serif);font-weight:700;letter-spacing:-.02em;line-height:1.04;color:var(--ink);
  font-size:44px;margin-top:10px}
.sub{font-family:var(--mono);font-size:13px;letter-spacing:.02em;color:var(--mut);line-height:1.7;margin-top:16px;max-width:52ch}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:40px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh-md);
  padding:22px;display:flex;flex-direction:column;align-items:center;transition:box-shadow .2s,border-color .2s}
.card:hover{box-shadow:var(--sh-lg)}
.card.x{border-top:3px solid var(--hl2)}
.card.web{border-top:3px solid var(--somm)}
.card img{width:100%;max-width:340px;height:auto;display:block}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;margin-top:18px}
.card.x .tag{color:var(--hl)}
.card.web .tag{color:var(--sommtext)}
.link{margin-top:6px;font-family:var(--serif);font-weight:700;font-size:22px;letter-spacing:-.01em;
  text-decoration:none;color:var(--ink)}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.card.x .link:hover{text-decoration-color:var(--hl2)}
.card.web .link:hover{text-decoration-color:var(--somm)}
.foot{margin-top:40px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--faint);
  display:flex;align-items:center;gap:8px}
.foot b{font-family:var(--wm);font-weight:600;color:var(--dim)}
</style>
</head>

  <div class="brand">aomi</div>
