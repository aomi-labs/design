<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Walkthrough</title>
<!--
  Eleven-announcer compositor. Turns rec/ (the recorded walkthrough) + timeline.js (compose.mjs) into
  the branded video: title card → the app in a browser window with zooms, step chips and subtitles → Aomi outro.
  The title card, subtitles, outro and playback contract come from kit/ (skills/aomi-video-kit); this file
  only draws the browser window. The frame is a pure function of time (seek awaits the screenshot decode).
-->
<link rel="stylesheet" href="kit/kit.css">
<style>
#win{position:absolute;left:160px;width:1600px;border-radius:14px;background:#fff;border:1px solid var(--cool-200);box-shadow:0 30px 80px -30px rgba(9,9,11,.28),0 2px 6px rgba(9,9,11,.06);overflow:hidden;opacity:0}
#bar{height:46px;display:flex;align-items:center;gap:16px;padding:0 18px;border-bottom:1px solid var(--cool-200);background:#fff}
#bar .dots{display:flex;gap:8px}#bar .dots b{width:12px;height:12px;border-radius:50%;background:var(--cool-200)}
#chip{font:600 16px var(--font-sans);color:var(--ink);white-space:nowrap}#chip span{font:500 15px var(--font-mono);color:var(--sky-deep);margin-right:8px}
#url{margin-left:auto;margin-right:auto;font:400 15px var(--font-mono);color:var(--muted);background:var(--cool-100);padding:6px 16px;border-radius:999px;max-width:700px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#view{position:relative;overflow:hidden;background:#fff}
#shot{position:absolute;left:0;top:0;transform-origin:0 0;display:block}
</style>
</head>
<body>
<div id="stage" class="aomi-stage">
  <div id="win"><div id="bar"><div class="dots"><b></b><b></b><b></b></div><div id="chip"></div><div id="url"></div></div><div id="view"><img id="shot" alt=""></div></div>
</div>
<script src="timeline.js"></script>
<script src="kit/kit.js"></script>
<script>
(() => {
  const E = window.EA, K = window.AOMI_KIT, { seg, lerp, eio, eout } = K.ease, $ = id => document.getElementById(id);
  const stage = $('stage'), { w: VW, h: VH } = E.viewport, CW = 1600, CH = Math.round(CW * VH / VW), D = CW / VW, BAR = 46;
  const win = $('win'), view = $('view'), shot = $('shot'), top = Math.round((1080 - CH - BAR) / 2) - 6;
  win.style.top = top + 'px'; view.style.height = CH + 'px'; shot.style.width = CW + 'px'; shot.style.height = CH + 'px';
  const title = K.title(stage, { eyebrow: E.meta.eyebrow || 'Shipped', title: E.meta.title, subtitle: E.meta.subtitle });
  const outro = K.outro(stage, { title: E.meta.title, link: E.meta.link });
  const interp = (keys, T) => { if (T <= keys[0][0]) return keys[0].slice(1); for (let i = 0; i < keys.length - 1; i++) { const a = keys[i], b = keys[i + 1]; if (T <= b[0]) return a.slice(1).map((v, j) => lerp(v, b[j + 1], (b[0] > a[0] ? (T - a[0]) / (b[0] - a[0]) : 1))); } return keys.at(-1).slice(1); };
  const ease = (keys, T) => { if (T <= keys[0][0]) return keys[0].slice(1); for (let i = 0; i < keys.length - 1; i++) { const a = keys[i], b = keys[i + 1]; if (T <= b[0]) { const x = eio(b[0] > a[0] ? (T - a[0]) / (b[0] - a[0]) : 1); return a.slice(1).map((v, j) => lerp(v, b[j + 1], x)); } } return keys.at(-1).slice(1); };
  const frameAt = t => { let lo = 0, hi = E.frames.length - 1; if (t <= E.frames[0].t) return E.frames[0].f; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (E.frames[m].t <= t) lo = m; else hi = m - 1; } return E.frames[lo].f; };
  const host = u => { try { const x = new URL(u); return x.host + x.pathname.replace(/\/$/, ''); } catch { return u || ''; } };
  const O = E.dur - E.outro;

  async function seek(T) {
    title.seek(T, E.intro);
    win.style.opacity = seg(T, E.intro - .75, E.intro - .15); win.style.transform = `translateY(${(1 - eout(seg(T, E.intro - .75, E.intro))) * 40}px)`;
    const [recT] = interp(E.map, T), f = frameAt(recT);
    if (shot.dataset.f !== f) { shot.dataset.f = f; shot.src = 'rec/' + f; await shot.decode().catch(() => {}); }
    const [cx, cy, s] = ease(E.zooms, T);
    shot.style.transform = `translate(${(CW / 2 - cx * D * s).toFixed(2)}px,${(CH / 2 - cy * D * s).toFixed(2)}px) scale(${s.toFixed(4)})`;
    const st = E.steps.find(x => T >= x.T0 && T < x.T1) || (T < E.intro ? E.steps[0] : E.steps.at(-1));
    const chip = `<span>${String(E.steps.indexOf(st) + 1).padStart(2, '0')}</span>${st.title || ''}`;
    if ($('chip').innerHTML !== chip) $('chip').innerHTML = chip; $('url').textContent = host(st.url);
    outro.seek(T, O);
  }
  K.film({ duration: E.dur, seek, stage, cues: E.cues });
})();
</script>
</body>
</html>
