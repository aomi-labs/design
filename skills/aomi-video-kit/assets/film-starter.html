<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aomi update</title>
<!--
  Announcement film starter: title card → one card per scene (heading, lines that appear one by one, an
  optional product shot) → the Aomi lockup. Everything brand comes from kit/ (fonts, colours, title, subtitles,
  outro, playback contract). You edit META and SCENES; the frame is a pure function of time, seek(t).
  Voice it with vo/script.mjs: anchor each line's words to the `at` + line times below.
-->
<link rel="stylesheet" href="kit/kit.css">
<style>
.scene{position:absolute;left:160px;top:0;bottom:0;width:1600px;display:flex;align-items:center;opacity:0}
.scene .copy{flex:1 1 0;min-width:0}
.scene.shot .copy{flex:0 0 760px}
.scene h2{margin:0 0 26px;font:700 72px/1.08 var(--font-display);letter-spacing:-.02em;color:var(--ink)}
.scene .rule{width:72px;height:4px;background:var(--sky);border-radius:2px;margin-bottom:34px;transform-origin:0 50%}
.scene li{list-style:none;margin:0 0 18px;font:400 38px/1.3 var(--font-sans);color:var(--cool-700);display:flex;gap:18px;align-items:flex-start;opacity:0}
.scene li i{flex:0 0 12px;width:12px;height:12px;border-radius:50%;background:var(--sky);margin-top:18px}
.scene ul{margin:0;padding:0}
.scene .pic{flex:1 1 0;margin-left:80px;background:#fff;border:1px solid var(--cool-200);border-radius:14px;box-shadow:0 30px 80px -30px rgba(9,9,11,.28),0 2px 6px rgba(9,9,11,.06);overflow:hidden;opacity:0}
.scene .pic img{display:block;width:100%;height:auto}
</style>
</head>
<body>
<div id="stage" class="aomi-stage"></div>
<script src="vo/timeline.js" onerror="void 0"></script>
<script src="kit/kit.js"></script>
<script>
const META = { eyebrow: 'October update', title: "What's new at Aomi", subtitle: 'Three things we shipped this month.', link: 'aomi.dev · @aomi_labs' };
// one card per scene. `at`: when it starts on the film clock. Lines appear 1.2 s apart from at + 0.8.
// `shot`: optional image (a product capture) shown on the right. `tag`: chapter tag, top left.
const SCENES = [
  { at: 3.4, tag: '01 · Arc Studio', heading: 'Agentic fuzzer for Arc Studio', lines: ['Runs attack campaigns on forked chain state', 'Surfaces exploitable call sequences before you launch'] },
  { at: 9.6, tag: '02 · Arc mainnet', heading: 'Live on Arc mainnet', lines: ['Circle StableFX flow', 'Agents execute stablecoin transactions on Arc'] },
  { at: 15.6, tag: '03 · Try it', heading: 'aomi.dev', lines: ['Deploy an agent from chat'] },
];
const K = window.AOMI_KIT, { seg, eio, eout, win } = K.ease, stage = document.getElementById('stage');
const INTRO = 3.4, OUTRO = 4.6, LAST = SCENES.at(-1).at + 4.5, DUR = LAST + OUTRO;

const title = K.title(stage, META), outro = K.outro(stage, META);
const cards = SCENES.map((s, i) => {
  const el = document.createElement('div'); el.className = 'scene' + (s.shot ? ' shot' : '');
  el.innerHTML = `<div class="copy"><h2></h2><div class="rule"></div><ul>${s.lines.map(() => '<li><i></i><span></span></li>').join('')}</ul></div>${s.shot ? `<div class="pic"><img src="${s.shot}" alt=""></div>` : ''}`;
  el.querySelector('h2').textContent = s.heading; el.querySelectorAll('li span').forEach((x, k) => x.textContent = s.lines[k]);
  stage.appendChild(el);
  return { el, chap: s.tag ? K.chapter(stage, s.tag) : null, t0: s.at, t1: SCENES[i + 1]?.at ?? LAST };
});

function seek(t) {
  title.seek(t, INTRO);
  cards.forEach(({ el, chap, t0, t1 }) => {
    const o = win(t, t0, t1, .45); el.style.opacity = o; el.style.transform = `translateY(${(1 - eout(seg(t, t0, t0 + .7))) * 24 - seg(t, t1 - .45, t1) * 16}px)`;
    el.querySelector('.rule').style.transform = `scaleX(${eout(seg(t, t0 + .3, t0 + .9))})`;
    el.querySelectorAll('li').forEach((li, k) => { const a = t0 + .8 + k * 1.2; li.style.opacity = seg(t, a, a + .4); li.style.transform = `translateY(${(1 - eout(seg(t, a, a + .6))) * 14}px)`; });
    const pic = el.querySelector('.pic'); if (pic) { pic.style.opacity = seg(t, t0 + .5, t0 + 1.1); pic.style.transform = `translateY(${(1 - eout(seg(t, t0 + .5, t0 + 1.3))) * 30}px)`; }
    if (chap) chap.seek(t, t0 + .2, t1);
  });
  outro.seek(t, DUR - OUTRO);
}
K.film({ duration: DUR, seek, stage });
</script>
</body>
</html>
