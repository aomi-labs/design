<script>
(function(){
  // scale 1280x720 stage to fit viewport
  var stage=document.getElementById('stage');
  function fit(){
    var s=Math.min(window.innerWidth/1280, window.innerHeight/720);
    stage.style.transform='scale('+s+')';
  }
  window.addEventListener('resize',fit); fit();
})();

/* live-widget conversation player — reveals the chat, then &quot;clicks&quot; Approve (turns green) */
(function(){
  var $=function(s){return document.querySelector(s)};
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var signBtn=$('#signBtn'), signLbl=signBtn&amp;&amp;signBtn.querySelector('.lbl');
  var revs=['#m-bu','#m-tr1','#m-tr2','#m-btx','#m-brow'];
  var SURF=['web','tg','dc','sl'];
  var timers=[];
  function setSurface(k){
    SURF.forEach(function(x){
      var v=document.getElementById('v-'+x); if(v) v.classList.toggle('show', x===k);
      var c=document.getElementById('c-'+x); if(c) c.classList.toggle('on', x===k);
      var r=document.getElementById('r-'+x); if(r) r.classList.toggle('on', x===k);
    });
  }
  var seq=[
    // — beat A · Somm Frontend (web): the conversation plays, Approve is clicked —
    [ 300, function(){ $('#m-bu').classList.add('on'); }],
    [1050, function(){ $('#m-tr1').classList.add('on'); }],
    [1950, function(){ $('#m-tr1').classList.add('done'); }],
    [2300, function(){ $('#m-tr2').classList.add('on'); }],
    [3200, function(){ $('#m-tr2').classList.add('done'); }],
    [3700, function(){ $('#m-btx').classList.add('on'); }],
    [4600, function(){ $('#m-brow').classList.add('on'); }],
    [5600, function(){ signBtn.classList.add('press'); }],
    [5950, function(){ signBtn.classList.remove('press'); signBtn.classList.add('signed'); signLbl.textContent='✓ Signed'; }],
    // — beat B · enumerate the other surfaces, swapping the center window —
    [ 7600, function(){ setSurface('tg'); }],
    [ 9800, function(){ setSurface('dc'); }],
    [12000, function(){ setSurface('sl'); }]
  ];
  var LOOP=14400;
  function reset(){
    timers.forEach(clearTimeout); timers=[];
    revs.forEach(function(s){ $(s).classList.remove('on'); });
    $('#m-tr1').classList.remove('done'); $('#m-tr2').classList.remove('done');
    signBtn.classList.remove('press','signed'); signLbl.textContent='Approve &amp; Sign';
    setSurface('web');
  }
  function run(){ reset(); seq.forEach(function(st){ timers.push(setTimeout(st[1], st[0])); }); }
  if(reduce){
    setSurface('web');
    revs.forEach(function(s){ $(s).classList.add('on'); });
    $('#m-tr1').classList.add('done'); $('#m-tr2').classList.add('done');
  } else {
    run(); setInterval(run, LOOP);
  }
})();
</script>

#pageno{right:54px;top:46px;font-size:11px;letter-spacing:.18em;color:var(--faint)}

/* ============ LEFT · TX PIPELINE (labels far-left · rail + dots to their right) ============ */

.pstep{position:absolute;left:0;width:320px;height:40px}
.pstep .dot{position:absolute;left:224px;top:0;width:40px;height:40px;border-radius:11px;

  box-shadow:var(--sh-sm);z-index:3}
.pstep .dot svg{width:19px;height:19px;color:var(--hl2)}
.pstep.hot .dot{border-color:var(--hl);background:var(--tint);box-shadow:0 0 0 5px rgba(82,136,194,.12)}
.pstep.hot .dot svg{color:var(--hl)}
.pstep .info{position:absolute;left:24px;top:13px;width:184px;text-align:right}

.pstep .badge{display:inline-block;margin-top:6px;white-space:nowrap;
  font-family:var(--mono);font-size:7px;letter-spacing:.08em;text-transform:uppercase;color:var(--sommtext);
  border:1px solid var(--sommline2);background:var(--sommtint);border-radius:999px;padding:2px 7px}
.pstep.sign .badge{color:var(--ok);border-color:var(--okline);background:var(--oktint)}
/* floating tx dots down the pipeline (build → broadcast) */
.pl-dot{position:absolute;left:240px;top:251px;width:8px;height:8px;border-radius:50%;
  background:var(--hl2);box-shadow:0 0 9px 2px rgba(82,136,194,.5);z-index:6;opacity:0}
.pl-dot{animation:pflow 4.2s var(--ease) infinite}
.pl-dot.b{animation-delay:1.4s}
.pl-dot.c{animation-delay:2.8s}
@keyframes pflow{
  0%{opacity:0;transform:translateY(0) scale(.6)}
  7%{opacity:1;transform:translateY(0) scale(1)}
  92%{opacity:1}
  100%{opacity:0;transform:translateY(255px) scale(.6)}

<style>
/* aomi design tokens — light theme · ink text · sky-blue + rosy-pink accents · lilac tints */
:root{
  --bg:#ffffff; --bg2:#fafafa; --panel:#ffffff; --panel2:#f4f4f5;
  --line:#e4e4e7; --line2:#d4d4d8;
  --ink:#09090b; --ink2:#3f3f46; --mut:#52525b; --dim:#71717a; --faint:#a1a1aa;
  --hl:#416cac; --hl2:#5288c2; --hlsoft:#7facd6; --tint:#e2eef8; --tintline:#aecbe8; --tintline2:#cfe1f3;
  --somm:#df5d90; --sommtext:#c8527f; --sommtint:#fbe4ef; --sommline:#efa6c5; --sommline2:#f6cbdd;
  --sommsoft:#f3b9d1;
  --ok:#2e9e6b; --orange:#e8853b;
  --sh-sm:0 1px 2px rgba(13,13,15,.04); --sh-md:0 4px 16px rgba(13,13,15,.06); --sh-lg:0 12px 40px rgba(13,13,15,.10);
  --sans:&quot;Geist&quot;,ui-sans-serif,system-ui,sans-serif;
  --mono:&quot;Geist Mono&quot;,ui-monospace,Menlo,monospace;
  --serif:&quot;PT Serif&quot;,ui-serif,Georgia,serif;
  --wm:&quot;Source Serif 4&quot;,ui-serif,Georgia,serif;
  --ease:cubic-bezier(.2,0,0,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg2);overflow:hidden}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center}

#fit{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1280px;height:720px;flex-shrink:0;transform-origin:center;
  background:
    radial-gradient(120% 90% at 78% 8%,rgba(82,136,194,.10),transparent 55%),
    radial-gradient(90% 80% at 10% 100%,rgba(223,93,144,.06),transparent 52%),
    var(--bg);
  overflow:hidden;border:1px solid var(--line)}

.chrome{position:absolute;z-index:40;font-family:var(--mono);pointer-events:none}
#brand{left:54px;top:44px;display:flex;align-items:center;gap:9px}
#brand svg{width:20px;height:20px;color:var(--ink)}
#brand b{font-family:var(--wm);font-weight:600;font-size:19px;letter-spacing:-.01em}
#brand .tag{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  border-left:1px solid var(--line2);padding-left:9px;margin-left:2px}
#pageno{right:54px;top:46px;font-size:11px;letter-spacing:.18em;color:var(--faint)}
#pageno i{color:var(--ink);font-style:normal}

.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s var(--ease);z-index:1}
.slide.active{opacity:1;visibility:visible;z-index:2}
.pad{position:absolute;inset:0;padding:80px 64px 44px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--hl)}
h1{font-family:var(--serif);font-weight:700;letter-spacing:-.02em;line-height:1.04;color:var(--ink)}
.i{color:var(--hl);font-style:normal}
.lead{font-family:var(--serif);font-weight:700;font-size:30px;line-height:1.06;letter-spacing:-.02em}
.rise{opacity:0;transform:translateY(16px)}
.slide.active .rise{animation:rise .8s var(--ease) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.d1{animation-delay:.05s}.d2{animation-delay:.13s}.d3{animation-delay:.22s}.d4{animation-delay:.32s}

/* ============ GTM SLIDE ============ */
#gtm .tabs{display:flex;gap:10px;margin-top:16px}
#gtm .tab{display:flex;flex-direction:column;gap:1px;text-align:left;min-width:148px;padding:7px 12px;
  border:1px solid var(--line2);border-radius:11px;background:var(--panel);cursor:pointer;
  font-family:var(--sans);box-shadow:var(--sh-sm);
  transition:border-color .4s var(--ease),background .4s var(--ease),color .4s var(--ease)}
#gtm .tab:hover{border-color:var(--tintline)}
#gtm .tab .tn{font-weight:600;font-size:12.5px;color:var(--ink)}
#gtm .tab .tsom{font-family:var(--mono);font-size:9px;color:var(--dim)}
#gtm .tab.on{background:var(--ink);border-color:var(--ink)}
#gtm .tab.on .tn{color:#fff}
#gtm .tab.on .tsom{color:rgba(255,255,255,.62)}

#gtm .thesis{font-family:var(--sans);font-size:17.5px;font-weight:500;line-height:1.42;color:var(--ink);
  margin-top:18px;max-width:118ch;min-height:50px}
#gtm .thesis .em{color:var(--sommtext)}
#gtm .thesis.fx{animation:thfade .5s var(--ease)}
@keyframes thfade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

#gtm .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.02fr);gap:34px;margin-top:20px;align-items:start}
#gtm .ct{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:14px}

/* funnel card */
#gtm .fcard{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:20px 22px}
#gtm .funnel{display:flex;flex-direction:column;gap:16px}
#gtm .frow{display:grid;grid-template-columns:288px 1fr;gap:16px;align-items:center}
#gtm .ftrack{display:flex}
#gtm .fbar{height:46px;min-width:52px;width:52px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;font-weight:600;transition:width .7s var(--ease)}
#gtm .fbar.tam{background:#e6e6e9;color:var(--ink2)}
#gtm .fbar.sam{background:var(--tintline);color:#1e3450}
#gtm .fbar.som{background:var(--somm);color:#fff}
#gtm .fv b{font-family:var(--serif);font-weight:700;font-size:27px;letter-spacing:-.01em;display:block;line-height:1.05}
#gtm .fv small{font-family:var(--mono);font-size:10px;color:var(--dim);line-height:1.45;display:block;margin-top:3px}
#gtm .fv.som b{color:var(--sommtext)}
#gtm .feq{font-family:var(--mono);font-size:10px;color:var(--sommtext);margin-top:5px;letter-spacing:.01em;font-variant-numeric:tabular-nums}
#gtm .fnote{font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-top:16px;line-height:1.5}

/* right column: ramp + donut */
#gtm .ramp{display:flex;align-items:flex-end;gap:12px;height:150px;padding-top:4px}
#gtm .rb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
#gtm .rfill{width:100%;max-width:42px;height:3px;background:var(--somm);border-radius:5px 5px 0 0;min-height:3px;transition:height .7s var(--ease)}
#gtm .rb.dim .rfill{background:var(--sommsoft)}
#gtm .rb b{font-family:var(--mono);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
#gtm .rb span{font-family:var(--mono);font-size:10px;color:var(--dim)}

#gtm .mix{display:flex;align-items:center;gap:22px}
#gtm .donut{flex:0 0 auto}
#gtm .donut circle{transition:stroke-dasharray .7s var(--ease),stroke-dashoffset .7s var(--ease)}
#gtm .donut .dc-val{font-family:var(--serif);font-weight:700;font-size:23px;fill:var(--ink)}
#gtm .donut .dc-lbl{font-family:var(--mono);font-size:7.5px;fill:var(--dim);letter-spacing:.14em}
#gtm .legend{flex:1;display:flex;flex-direction:column}
#gtm .lrow{display:grid;grid-template-columns:14px 1fr auto;gap:11px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
#gtm .lrow:first-child{border-top:0}
#gtm .ldot{width:11px;height:11px;border-radius:3px}
#gtm .lname{font-weight:600;font-size:13px;color:var(--ink)}
#gtm .lval{font-family:var(--mono);font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}

#gtm .gfoot{font-family:var(--mono);font-size:10px;color:var(--mut);margin-top:16px}
#gtm .gfoot b{color:var(--hl);font-weight:500}

/* current-traction cluster (top-right) */
#gtm .trac{position:absolute;top:74px;left:672px;width:544px;z-index:6}
#gtm .trac-hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
#gtm .trac-hd .t{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);font-weight:700}
#gtm .trac-hd .s{font-family:var(--mono);font-size:8.5px;letter-spacing:.05em;color:var(--faint)}
#gtm .trow{display:flex;gap:8px}
#gtm .tb{flex:1;min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:9px 10px;box-shadow:var(--sh-sm)}
#gtm .tb.hlbg{background:var(--tint);border-color:var(--tintline2)}
#gtm .tb .num{font-family:var(--serif);font-weight:700;font-size:25px;line-height:1;letter-spacing:-.01em;color:var(--ink)}
#gtm .tb .lbl{font-family:var(--mono);font-size:7px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);line-height:1.45;margin-top:7px}
#gtm .tb .sub{font-family:var(--mono);font-size:7px;letter-spacing:.02em;line-height:1.45;margin-top:6px}
#gtm .tb .sub.hl{color:var(--hl)}
#gtm .tb .sub.dim{color:var(--faint)}
#gtm .tb.dev{flex:1.45}
#gtm .tb.dev .dh{font-family:var(--mono);font-size:7px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:700}
#gtm .tb.dev .drow{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-top:5px}
#gtm .tb.dev .dnum{font-family:var(--serif);font-weight:700;font-size:22px;line-height:1;color:var(--sommtext)}
#gtm .tb.dev .dcap{font-family:var(--mono);font-size:6.5px;letter-spacing:.02em;color:var(--faint);text-align:right;line-height:1.4}
#gtm .tb.dev .bars{display:flex;align-items:flex-end;gap:4px;height:24px;margin-top:7px}
#gtm .tb.dev .bars i{flex:1;border-radius:2px 2px 0 0}

@media (prefers-reduced-motion:reduce){#gtm .fbar,#gtm .rfill,#gtm .donut circle{transition:none}}
</style>

<script>
(function(){
  var COLOR = { outcome:&quot;#df5d90&quot;, tool:&quot;#2e9e6b&quot;, model:&quot;#e8853b&quot;, hosting:&quot;#5288c2&quot; };
  var ENGINES = [[&quot;outcome&quot;,&quot;Outcome&quot;],[&quot;tool&quot;,&quot;Paid-tool take&quot;],[&quot;model&quot;,&quot;Model margin&quot;],[&quot;hosting&quot;,&quot;Hosting&quot;]];
  var ORDER = [&quot;platform&quot;,&quot;wallet&quot;,&quot;dam&quot;];

  var WEDGES = {
    wallet: {
      thesis:'Every wallet and retail-fintech app embeds aomi as its AI &amp;amp; execution layer — <span class=&quot;em&quot;>Cash App scale, on-chain</span>. Partners like MetaMask bring their own model keys (BYOK), so managed-model margin stays thin; the money is huge retail flow.',
      tam:[&quot;$2.5B&quot;,2.5e9,&quot;if all retail on-chain flow ran on aomi pricing&quot;],
      sam:[&quot;$350M&quot;,350e6,&quot;14% of TAM — agent-mediated, crypto-native, embeddable&quot;],
      som:[&quot;$35.6M&quot;,35.6e6,&quot;our Y5 target&quot;],
      eq:&quot;$2.5B × 14% × 10.2%&quot;,
      ramp:[0.39,2.16,8.48,20.12,35.60],
      mix:{ outcome:[&quot;$28.8M&quot;,81], tool:[&quot;$5.0M&quot;,14], model:[&quot;$1.2M&quot;,3], hosting:[&quot;$0.6M&quot;,2] }
    },
    dam: {
      thesis:'Fund managers, DAO treasuries and RWA desks run execution &amp;amp; ops through aomi agents — <span class=&quot;em&quot;>few users, enormous AUM</span>. High-touch managed AI plus rich fees on large managed flow.',
      tam:[&quot;$3.5B&quot;,3.5e9,&quot;execution / mgmt fees on all on-chain AUM turnover&quot;],
      sam:[&quot;$500M&quot;,500e6,&quot;14% of TAM — crypto-native funds, agent-run treasury ops&quot;],
      som:[&quot;$51.4M&quot;,51.4e6,&quot;our Y5 target&quot;],
      eq:&quot;$3.5B × 14.3% × 10.3%&quot;,
      ramp:[0.47,3.08,11.18,27.68,51.38],
      mix:{ outcome:[&quot;$48.0M&quot;,93], tool:[&quot;$3.0M&quot;,6], model:[&quot;$0.3M&quot;,1], hosting:[&quot;$0.1M&quot;,0] }
    },
    platform: {
      thesis:'A long tail of builders ship agent-apps and bots hosted on aomi — <span class=&quot;em&quot;>tens of thousands of apps</span>. Most builders never wire their own key, so they run on aomi&amp;#39;s managed model; hosting is the annuity, managed-model is real upside.',
      tam:[&quot;$1.0B&quot;,1.0e9,&quot;hosting + long-tail flow across all agent-apps&quot;],
      sam:[&quot;$150M&quot;,150e6,&quot;15% of TAM — builders who host on aomi vs self-host&quot;],

  // per-tier max so the funnel shape holds but bar length still changes between cases
  var TMAX = { tam:0, sam:0, som:0 };
  ORDER.forEach(function(k){ var w=WEDGES[k]; TMAX.tam=Math.max(TMAX.tam,w.tam[1]); TMAX.sam=Math.max(TMAX.sam,w.sam[1]); TMAX.som=Math.max(TMAX.som,w.som[1]); });
  var BASE = { tam:280, sam:176, som:112 };

  var root = document.getElementById(&quot;gtm&quot;);
  var thesisEl = root.querySelector(&quot;[data-thesis]&quot;);

  var R=68, TH=24, CIRC=2*Math.PI*R;

  // ---- build persistent DOM once (so value/width/arc changes can transition) ----
  funnelEl.innerHTML = [&quot;tam&quot;,&quot;sam&quot;,&quot;som&quot;].map(function(t){
    return '<div class=&quot;frow&quot;><div class=&quot;ftrack&quot;><div class=&quot;fbar '+t+'&quot; data-bar=&quot;'+t+'&quot;>'+t.toUpperCase()+'</div></div>'+

  }).join(&quot;&quot;);
  donutEl.innerHTML = ENGINES.map(function(e){
    return '<circle data-seg=&quot;'+e[0]+'&quot; cx=&quot;80&quot; cy=&quot;80&quot; r=&quot;'+R+'&quot; fill=&quot;none&quot; stroke=&quot;'+COLOR[e[0]]+'&quot; stroke-width=&quot;'+TH+'&quot; stroke-dasharray=&quot;0 '+CIRC+'&quot; stroke-dashoffset=&quot;0&quot; transform=&quot;rotate(-90 80 80)&quot;></circle>';
  }).join(&quot;&quot;) + '<text class=&quot;dc-val&quot; data-dcval x=&quot;80&quot; y=&quot;79&quot; text-anchor=&quot;middle&quot; dominant-baseline=&quot;middle&quot;></text><text class=&quot;dc-lbl&quot; x=&quot;80&quot; y=&quot;95&quot; text-anchor=&quot;middle&quot;>SOM · Y5</text>';
  legendEl.innerHTML = ENGINES.map(function(e){
    return '<div class=&quot;lrow&quot;><span class=&quot;ldot&quot; style=&quot;background:'+COLOR[e[0]]+'&quot;></span><span class=&quot;lname&quot;>'+e[1]+'</span><span class=&quot;lval&quot; data-lval=&quot;'+e[0]+'&quot;></span></div>';
  }).join(&quot;&quot;);

  function width(tier,val){ return Math.max(52, Math.round(BASE[tier]*val/TMAX[tier])); }

  function render(id){
    var w = WEDGES[id];
    tabs.forEach(function(t){ t.classList.toggle(&quot;on&quot;, t.dataset.w===id); });

    thesisEl.classList.remove(&quot;fx&quot;); void thesisEl.offsetWidth;
    thesisEl.innerHTML = w.thesis; thesisEl.classList.add(&quot;fx&quot;);

    [&quot;tam&quot;,&quot;sam&quot;,&quot;som&quot;].forEach(function(t){
      root.querySelector('[data-bar=&quot;'+t+'&quot;]').style.width = width(t, w[t][1]) + &quot;px&quot;;
      var fv = root.querySelector('[data-fv=&quot;'+t+'&quot;]');
      fv.querySelector(&quot;b&quot;).textContent = w[t][0];
      fv.querySelector(&quot;small&quot;).textContent = w[t][2];
    });
    root.querySelector(&quot;[data-feq]&quot;).textContent = &quot;= &quot; + w.eq;

    var max = Math.max.apply(null, w.ramp);
    w.ramp.forEach(function(v,i){
      var rb = root.querySelector('[data-rb=&quot;'+i+'&quot;]');
      rb.querySelector(&quot;b&quot;).textContent = v.toFixed(2);
      rb.querySelector(&quot;.rfill&quot;).style.height = Math.max(3, Math.round(v/max*118)) + &quot;px&quot;;
    });

    var off = 0;
    ENGINES.forEach(function(e){
      var pct = w.mix[e[0]] ? w.mix[e[0]][1] : 0;
      var len = pct/100*CIRC;
      var c = root.querySelector('[data-seg=&quot;'+e[0]+'&quot;]');
      c.setAttribute(&quot;stroke-dasharray&quot;, len + &quot; &quot; + (CIRC-len));
      c.setAttribute(&quot;stroke-dashoffset&quot;, -off);
      off += len;
      var lv = root.querySelector('[data-lval=&quot;'+e[0]+'&quot;]');
      lv.textContent = w.mix[e[0]] ? (w.mix[e[0]][0] + &quot; · &quot; + w.mix[e[0]][1] + &quot;%&quot;) : &quot;—&quot;;
    });
    root.querySelector(&quot;[data-dcval]&quot;).textContent = w.som[0];
  }

  // ---- manual wedge stepping · no auto-cycle · opens on the first wedge ----
  var idx = 0;
  function go(i){ idx = Math.max(0, Math.min(ORDER.length - 1, i)); render(ORDER[idx]); }

  tabs.forEach(function(t){ t.addEventListener(&quot;click&quot;, function(){ go(ORDER.indexOf(t.dataset.w)); }); });

  // → / ← step through the wedges. Only swallow the key while a step is still
  // possible, so at the two ends a surrounding deck can still change slides.
  document.addEventListener(&quot;keydown&quot;, function(e){
    if(e.key === &quot;ArrowRight&quot; &amp;&amp; idx < ORDER.length - 1){ go(idx + 1); e.preventDefault(); e.stopImmediatePropagation(); }
    else if(e.key === &quot;ArrowLeft&quot; &amp;&amp; idx > 0){ go(idx - 1); e.preventDefault(); e.stopImmediatePropagation(); }
  }, true);

  // make sure the arrow keys land in this slide when it's on screen
  // (grab focus on load and on any pointer interaction)
  function grab(){ try{ window.focus(); }catch(e){} }
  window.addEventListener(&quot;load&quot;, grab);
  root.addEventListener(&quot;pointerdown&quot;, grab);

  go(0);

  var stage = document.getElementById(&quot;stage&quot;);
  function fit(){ stage.style.transform = &quot;scale(&quot; + Math.min(window.innerWidth/1280, window.innerHeight/720) + &quot;)&quot;; }
  window.addEventListener(&quot;resize&quot;, fit); fit();
})();
</script>
</body>
</html>
"></iframe>
</div>
<button class="navbtn" id="prev" aria-label="previous"></button>
<button class="navbtn" id="next" aria-label="next"></button>
<div id="dots"></div>
<div id="rail"></div>
<div id="hint">← → to move</div>
<script>
(function(){
  var frames=[].slice.call(document.querySelectorAll(".frame"));
  var total=frames.length, cur=0;
  var dotsWrap=document.getElementById("dots"), railWrap=document.getElementById("rail");
  frames.forEach(function(f,i){
    var d=document.createElement("div"); d.className="dot"+(i===0?" on":""); d.addEventListener("click",function(){go(i)}); dotsWrap.appendChild(d);
    var r=document.createElement("div"); r.className="rdot"+(i===0?" on":""); r.textContent=i+1; r.title=f.dataset.title||("slide "+(i+1)); r.addEventListener("click",function(){go(i)}); railWrap.appendChild(r);
  });
  var dots=[].slice.call(dotsWrap.children), rdots=[].slice.call(railWrap.children);
  function pad(n){return (n<10?"0":"")+n;}
  function fixPage(f,i){ try{ var doc=f.contentDocument; if(!doc) return; var pg=doc.querySelector("#pageno"); if(pg) pg.innerHTML="<i class=\"cur\">"+pad(i+1)+"</i> / "+pad(total); }catch(e){} }
  function forwardKeys(f){ try{ f.contentWindow.document.addEventListener("keydown", onKey); }catch(e){} }
  function focusFrame(f){ try{ f.contentWindow.focus(); }catch(e){} }
  frames.forEach(function(f,i){
    if(f.tagName==="IFRAME"){
      f.addEventListener("load", function(){ fixPage(f,i); forwardKeys(f); });
      try{ if(f.contentDocument && f.contentDocument.readyState==="complete"){ fixPage(f,i); forwardKeys(f); } }catch(e){}
    }
  });
  function go(i){
    if(i<0)i=0; if(i>=total)i=total-1;
    frames.forEach(function(f,j){ f.classList.toggle("active", j===i); });
    dots.forEach(function(d,j){ d.classList.toggle("on", j===i); });
    rdots.forEach(function(r,j){ r.classList.toggle("on", j===i); });
    cur=i; fixPage(frames[i], i); focusFrame(frames[i]);
  }
  function onKey(e){
    if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){ e.preventDefault(); go(cur+1); }
    else if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); go(cur-1); }
    else if(e.key==="Home"){ go(0); } else if(e.key==="End"){ go(total-1); }
  }
  document.addEventListener("keydown", onKey);
  document.getElementById("next").addEventListener("click",function(){go(cur+1)});
  document.getElementById("prev").addEventListener("click",function(){go(cur-1)});
  go(0);
})();
</script>
