<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aomi — cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --bg2:#fafafa; --panel:#ffffff; --panel2:#f4f4f5;
  --line:#e4e4e7; --line2:#d4d4d8;
  --ink:#09090b; --ink2:#3f3f46; --mut:#52525b; --dim:#71717a; --faint:#a1a1aa;
  --hl:#416cac; --hl2:#5288c2; --hlsoft:#7facd6; --tint:#e2eef8; --tintline:#aecbe8; --tintline2:#cfe1f3;
  --somm:#df5d90; --sommtext:#c8527f; --sommtint:#fbe4ef;
  --sans:"Geist",ui-sans-serif,system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --serif:"PT Serif",ui-serif,Georgia,serif;
  --wm:"Source Serif 4",ui-serif,Georgia,serif;
  --ease:cubic-bezier(.2,0,0,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg2);overflow:hidden}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center}

#fit{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1280px;height:720px;transform-origin:center;
  background:
    radial-gradient(120% 90% at 78% 8%,rgba(82,136,194,.10),transparent 55%),
    radial-gradient(90% 80% at 10% 100%,rgba(223,93,144,.06),transparent 52%),
    var(--bg);
  overflow:hidden;border:1px solid var(--line)}

.chrome{position:absolute;z-index:40;font-family:var(--mono);pointer-events:none}
#brand{left:54px;top:44px;display:flex;align-items:center;gap:9px}
#brand svg{width:20px;height:20px;color:var(--ink)}
#brand b{font-family:var(--wm);font-weight:600;font-size:19px;letter-spacing:-.01em}
#brand .tag{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  border-left:1px solid var(--line2);padding-left:9px;margin-left:2px}
#pageno{right:54px;top:46px;font-size:11px;letter-spacing:.18em;color:var(--faint)}
#pageno i{color:var(--ink);font-style:normal}

.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s var(--ease);z-index:1}
.slide.active{opacity:1;visibility:visible;z-index:2}
h1{font-family:var(--serif);font-weight:700;letter-spacing:-.02em;line-height:1.04;color:var(--ink)}
.i{color:var(--hl);font-style:normal}

.rise{opacity:0;transform:translateY(16px)}
.slide.active .rise{animation:rise .8s var(--ease) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.d1{animation-delay:.06s}.d2{animation-delay:.16s}.d3{animation-delay:.28s}.d4{animation-delay:.42s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}

/* ============ HERO ============ */
#s1 .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#s1 .orbit{position:relative;width:230px;height:230px;margin-bottom:6px}
#s1 .orbit .ring{position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(82,136,194,.45)}
#s1 .orbit .ring.r2{inset:26px;border-color:rgba(223,93,144,.38)}
#s1 .r1{animation:spin 26s linear infinite}
#s1 .r2{animation:spinr 20s linear infinite}
#s1 .orbit .sat{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--hl2);
  top:-5px;left:calc(50% - 4.5px);box-shadow:0 1px 6px rgba(82,136,194,.5)}
#s1 .orbit .sat.b{background:var(--somm);box-shadow:0 1px 6px rgba(223,93,144,.5)}
#s1 .core{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#s1 .core svg{width:96px;height:96px;color:var(--ink);filter:drop-shadow(0 4px 18px rgba(13,13,15,.14))}
#s1 .wm{font-family:var(--wm);font-weight:700;font-size:104px;line-height:.9;letter-spacing:-.02em;margin-top:8px}
#s1 h1{font-size:33px;margin-top:26px}
#s1 .sub{font-family:var(--mono);font-size:14px;letter-spacing:.06em;color:var(--mut);margin-top:22px;max-width:640px;line-height:1.7}
#s1 .pw{font-family:var(--mono);font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--dim);margin-bottom:30px}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="fit"><div id="stage">

  <div class="chrome" id="brand">
    <svg viewBox="0 0 362 362" fill="currentColor"><path d="M321.778 94.2349C321.778 64.4045 297.595 40.2222 267.765 40.2222C237.935 40.2222 213.752 64.4045 213.752 94.2349C213.752 124.065 237.935 148.248 267.765 148.248C297.595 148.248 321.778 124.065 321.778 94.2349ZM362 94.2349C362 146.279 319.81 188.47 267.765 188.47C215.721 188.47 173.53 146.279 173.53 94.2349C173.53 42.1904 215.721 1.33271e-06 267.765 0C319.81 0 362 42.1904 362 94.2349Z"/><path d="M181 0C184.792 0 188.556 0.116399 192.289 0.346221C189.506 2.74481 186.833 5.26892 184.28 7.90977C170.997 20.759 160.669 36.6452 154.42 54.4509C95.7682 66.7078 51.7143 118.709 51.7143 181C51.7143 252.403 109.597 310.286 181 310.286C243.292 310.286 295.291 266.231 307.547 207.58C325.364 201.327 341.259 190.99 354.113 177.695C356.745 175.149 359.261 172.486 361.653 169.71C361.883 173.444 362 177.208 362 181C362 280.964 280.964 362 181 362C81.0365 362 0 280.964 0 181C0 81.0365 81.0365 0 181 0Z"/></svg>
    <b>aomi</b><span class="tag">investor overview</span>
  </div>
  <div class="chrome" id="pageno"><i class="cur">01</i> / <span>06</span></div>

  <section class="slide active" id="s1" data-title="Hero">
    <div class="wrap">
      <div class="pw rise d1">powered by</div>
      <div class="orbit rise d1">
        <div class="ring r1"><span class="sat"></span></div>
        <div class="ring r2"><span class="sat b" style="top:auto;bottom:-4px"></span></div>
        <div class="core"><svg viewBox="0 0 362 362" fill="currentColor"><path d="M321.778 94.2349C321.778 64.4045 297.595 40.2222 267.765 40.2222C237.935 40.2222 213.752 64.4045 213.752 94.2349C213.752 124.065 237.935 148.248 267.765 148.248C297.595 148.248 321.778 124.065 321.778 94.2349ZM362 94.2349C362 146.279 319.81 188.47 267.765 188.47C215.721 188.47 173.53 146.279 173.53 94.2349C173.53 42.1904 215.721 1.33271e-06 267.765 0C319.81 0 362 42.1904 362 94.2349Z"/><path d="M181 0C184.792 0 188.556 0.116399 192.289 0.346221C189.506 2.74481 186.833 5.26892 184.28 7.90977C170.997 20.759 160.669 36.6452 154.42 54.4509C95.7682 66.7078 51.7143 118.709 51.7143 181C51.7143 252.403 109.597 310.286 181 310.286C243.292 310.286 295.291 266.231 307.547 207.58C325.364 201.327 341.259 190.99 354.113 177.695C356.745 175.149 359.261 172.486 361.653 169.71C361.883 173.444 362 177.208 362 181C362 280.964 280.964 362 181 362C81.0365 362 0 280.964 0 181C0 81.0365 81.0365 0 181 0Z"/></svg></div>
      </div>
      <div class="wm rise d2">aomi</div>
      <h1 class="rise d3">The blockchain harness<br>for <span class="i">agentic AI</span></h1>
      <div class="sub rise d4">Bring your API. Ship it as an agent.<br>Get safe, non-custodial onchain execution — for free.</div>
    </div>
  </section>

</div></div>

<script>
(function(){
  var stage=document.getElementById('stage');
  function fit(){ stage.style.transform='scale('+Math.min(window.innerWidth/1280, window.innerHeight/720)+')'; }
  window.addEventListener('resize',fit); fit();
})();
</script>
</body>
</html>
