<!doctype html>

<style>
:root{--ink:#09090b;--paper:#ffffff;--sky:#5288c2;--sky2:#416cac;--rose:#df5d90;--lilac:#e3d8e6;--muted:#71717a}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--paper)}
body.fit{transform-origin:0 0}
#stage,#labels,#hud,#veil,#vig,#flat{position:absolute;inset:0}
#labels,#hud,#vig,#flat{pointer-events:none}
canvas{display:block}
#vig{background:linear-gradient(180deg,rgba(255,255,255,.78) 0,rgba(255,255,255,0) 170px,rgba(255,255,255,0) 640px,rgba(255,255,255,.9) 1080px),radial-gradient(ellipse at 50% 48%,rgba(255,255,255,0) 52%,rgba(255,255,255,.96) 100%)}
.lbl{position:absolute;left:0;top:0;font:500 17px 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);white-space:nowrap;opacity:0}
.lbl.rose{color:var(--rose)}
.lbl.sky{color:var(--sky2)}
.lbl.word{font:400 24px 'Geist Mono',monospace;letter-spacing:0;text-transform:none;color:var(--ink);background:rgba(255,255,255,.86);padding:6px 12px;border:1px solid rgba(9,9,11,.14);border-radius:999px}
.lbl.big{font:500 22px 'Geist Mono',monospace}
.lbl.num{font:600 30px 'Geist',sans-serif;letter-spacing:0}
.lbl.num small{display:block;font:500 14px 'Geist Mono',monospace;letter-spacing:.14em;color:var(--muted);text-align:center;margin-top:2px}
.lbl.rule{font:500 19px 'Geist Mono',monospace;letter-spacing:0;text-transform:none;background:rgba(255,255,255,.92);padding:5px 12px;border:1.5px solid rgba(9,9,11,.25);border-radius:8px}
.lbl.rule.bad{color:#fff;background:var(--rose);border-color:var(--rose)}
.lbl.rule.ok{color:#fff;background:var(--sky);border-color:var(--sky)}
.lbl.zone{font:600 21px 'Geist Mono',monospace;letter-spacing:.16em;background:rgba(255,255,255,.88);padding:7px 16px;border:1.5px dashed rgba(9,9,11,.45);border-radius:999px}
.lbl.stag{font:600 20px 'Geist Mono',monospace;letter-spacing:.06em;text-transform:none;color:#fff;background:var(--sky);padding:7px 16px;border-radius:8px}
.lbl.tag{font:600 18px 'Geist Mono',monospace;color:#fff;background:var(--rose);padding:5px 12px;border-radius:6px}
.chap{position:absolute;left:96px;top:78px;font:500 20px 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);display:flex;align-items:center;gap:14px;opacity:0}
.chap i{width:10px;height:10px;border-radius:50%;background:var(--sky)}
.kick{position:absolute;left:96px;bottom:92px;font:400 54px/1.12 'PT Serif',serif;color:var(--ink);max-width:1300px;opacity:0;letter-spacing:-.01em}
.kick em{color:var(--sky2);font-style:italic}
#rail{position:absolute;right:96px;top:70px;display:flex;gap:8px;opacity:0}
#rail span{font:600 18px 'Geist',sans-serif;width:52px;height:38px;display:grid;place-items:center;border:1.5px solid rgba(9,9,11,.22);border-radius:8px;color:rgba(9,9,11,.4)}
#rail span.on{border-color:var(--sky);color:#fff;background:var(--sky)}
#rail span.done{border-color:var(--sky);color:var(--sky2)}
#title{position:absolute;left:96px;bottom:190px;opacity:0}
#sub{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);max-width:1600px;text-align:center;font:500 34px/1.3 'Geist',sans-serif;color:#fff;background:rgba(9,9,11,.82);padding:10px 24px;border-radius:10px;opacity:0;white-space:nowrap}
#title .eyebrow{font:500 20px 'Geist Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
#title h1{margin:0;font:700 128px/0.95 'PT Serif',serif;letter-spacing:-.025em;color:var(--ink)}
#title p{margin:14px 0 0;font:italic 400 50px 'PT Serif',serif;color:var(--sky2)}
#veil{background:var(--paper);opacity:0}
#outro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0}
#outro .lock{display:flex;align-items:center;gap:48px}
#mark{width:140px;height:140px;overflow:visible;display:block}
#outro .wm{font:600 140px/1 'Source Serif 4',serif;letter-spacing:-.02em;color:var(--ink)}
#outro .sub{font:italic 400 44px 'PT Serif',serif;color:var(--ink);margin-top:46px}
#outro .url{font:500 22px 'Geist Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:30px}
#outro .wm,#outro .sub,#outro .url{opacity:0}
/* flat 2D layer */
#flat{opacity:0}
#flat .st{fill:none;stroke:#09090b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
#flat .thin{stroke-width:1.5}
#flat .sky{stroke:#5288c2}
#flat .rose{stroke:#df5d90}
#flat .dash{stroke-dasharray:8 7}
#flat .lb{font:500 17px 'Geist Mono',monospace;letter-spacing:.14em;fill:#09090b}
#flat .lb.s{fill:#416cac}
#flat .lb.r{fill:#df5d90}
#flat .lb.m{fill:#71717a}
#flat .lb.sm{font-size:15px}
#flat .num{font:600 34px 'Geist',sans-serif;fill:#09090b}
#flat .chip{fill:#ffffff;stroke:#09090b;stroke-width:1.5}
#flat .chip.on{fill:#5288c2;stroke:#5288c2}
#flat .chip.bad{fill:#df5d90;stroke:#df5d90}
#flat .ct{font:500 15px 'Geist Mono',monospace;letter-spacing:.08em;fill:#09090b}
#flat .ct.on,#flat .ct.bad{fill:#fff}
#flat .h2{font:600 26px 'Geist',sans-serif;fill:#09090b}
#flat .ttl{font:600 20px 'Geist',sans-serif;fill:#09090b}
#flat .node{font:500 22px 'Geist Mono',monospace;letter-spacing:.18em;fill:#09090b}
#flat .pk{font:500 21px 'Geist',sans-serif}
#flat .badge{font:600 18px 'Geist Mono',monospace;fill:#fff}
</style>
</head>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const W = 1920, H = 1080, DUR = 79.8, SETTLE_AT = 53.4, SETTLE_LEN = 2.6, DUR_REAL = DUR + SETTLE_LEN;
const params = new URLSearchParams(location.search);

// ---------- math ----------
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eout = x => 1 - Math.pow(1 - x, 3);
const ein = x => x * x * x;
const eback = x => { const c1 = 1.70158, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const win = (t, a, b, f = .4) => Math.min(seg(t, a, a + f), 1 - seg(t, b - f, b));
const pulse = (t, a, b) => Math.sin(Math.PI * seg(t, a, b));
const tiny = s => Math.max(s, 1e-3);
const deg = THREE.MathUtils.degToRad;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(11);
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function keyed(keys, t) {
  if (t <= keys[0][0]) return keys[0][1].slice();
  for (let i = 0; i < keys.length - 1; i++) {
    const [a, pa] = keys[i], [b, pb] = keys[i + 1];
    if (t <= b) { const x = eio(seg(t, a, b)); return pa.map((v, j) => lerp(v, pb[j], x)); }
  }
  return keys[keys.length - 1][1].slice();
}

// ---------- palette ----------
const C = { arch: 0x9d9da8, track: 0xa1a1aa, soft: 0x8c8a99, sky4: 0x7facd6, ring: 0xb4b4bf, ink: 0x09090b, paper: 0xffffff, sky: 0x5288c2, sky2: 0x416cac, rose: 0xdf5d90, lilac: 0xe3d8e6, lilac4: 0xb9a3c1, pink2: 0xf6cbdd, cool2: 0xe4e4e7, white: 0xffffff };
const ARCHC = new THREE.Color(C.arch), SOFT = new THREE.Color(C.soft), RINGC = new THREE.Color(C.ring), SKY = new THREE.Color(C.sky), ROSE = new THREE.Color(C.rose), INK = new THREE.Color(C.ink), WHITE = new THREE.Color(C.white);

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('stage').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(C.paper);
scene.fog = new THREE.Fog(C.paper, 30, 95);
const camera = new THREE.PerspectiveCamera(35, W / H, .1, 2000);
scene.add(new THREE.HemisphereLight(0xffffff, 0xece4e2, 1.25));
const sun = new THREE.DirectionalLight(0xffffff, 1.7);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 120 });
sun.shadow.bias = -.0005; sun.shadow.radius = 5;
scene.add(sun, sun.target);

// ---------- factories ----------
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .55, metalness: 0, ...o });
const glowM = (color, ei = .35, o = {}) => std(color, { emissive: color, emissiveIntensity: ei, ...o });
const lineM = (color = C.ink, op = 1) => new THREE.LineBasicMaterial({ color, transparent: true, opacity: op });
function edged(geo, mat, lcol = C.ink, lop = .9, edgeGeo) {
  const m = new THREE.Mesh(geo, mat); m.castShadow = true; m.receiveShadow = true;
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(edgeGeo || geo, 25), lineM(lcol, lop))); return m;
}
function mark(o) { o.traverse(n => { if (n.material) { n.material.transparent = true; n.userData.baseOp = n.material.opacity; } }); return o; }
function setOp(o, a) { o.visible = a > .002; o.traverse(n => { if (n.material && n.userData.baseOp !== undefined) n.material.opacity = a * n.userData.baseOp; }); }
function flatRing(r, tube, color, op = 1) { const m = new THREE.Mesh(new THREE.TorusGeometry(r, tube, 8, 96), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: op })); m.rotation.x = Math.PI / 2; return m; }
const tileGeo = new RoundedBoxGeometry(1.5, .95, .14, 4, .1);
// transaction icon: a banknote frame with "$", inked in a darker shade of the card colour
const ICON_INK = { [C.sky4]: '#1f3a63', [C.rose]: '#6e1c3d', [C.white]: '#09090b', [C.lilac]: '#4a3d55' };
const iconGeo = new THREE.PlaneGeometry(1.5, .95), iconCache = new Map();
function drawIcon(cv, ink) {
  const g = cv.getContext('2d'); g.clearRect(0, 0, 600, 380); g.strokeStyle = g.fillStyle = ink; g.lineWidth = 15; g.lineCap = 'round';
  g.beginPath(); g.roundRect(95, 72, 410, 236, 22); g.stroke();
  g.font = "600 150px 'Geist'"; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('$', 300, 200);
  g.beginPath(); g.moveTo(410, 118); g.lineTo(460, 118); g.moveTo(140, 262); g.lineTo(190, 262); g.stroke();
}
function iconTex(color) {
  if (!iconCache.has(color)) { const cv = document.createElement('canvas'); cv.width = 600; cv.height = 380; const ink = ICON_INK[color] || '#09090b'; drawIcon(cv, ink);
    const tx = new THREE.CanvasTexture(cv); tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 4; iconCache.set(color, { cv, tx, ink }); }
  return iconCache.get(color).tx;
}
function makeTile(color, ei = .25, lines = true) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(tileGeo, glowM(color, ei)); body.castShadow = true; g.add(body); g.userData.body = body;
  if (lines) [.075, -.075].forEach((z, k) => { const pl = new THREE.Mesh(iconGeo, new THREE.MeshBasicMaterial({ map: iconTex(color), transparent: true, depthWrite: false })); pl.position.z = z; pl.rotation.y = k ? Math.PI : 0; g.add(pl); });
  if (color === 0xffffff) body.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1.5, .95, .14)), lineM(C.ink, .5)));
  return g;
}
function glowTexture(rgb) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, `rgba(${rgb},.5)`); gr.addColorStop(.5, `rgba(${rgb},.14)`); gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; return tx;
}

// ---------- world: floor, grid, route ----------
const floor = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.ShadowMaterial({ opacity: .09 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const grid = new THREE.GridHelper(1200, 600, C.cool2, C.cool2);
grid.position.set(0, .002, -120); grid.material.transparent = true; grid.material.opacity = .6; scene.add(grid);
const routeGeo = new THREE.PlaneGeometry(.1, 1); routeGeo.rotateX(-Math.PI / 2); routeGeo.translate(0, .012, -.5);
const route = new THREE.Mesh(routeGeo, new THREE.MeshBasicMaterial({ color: C.track })); route.position.z = 1; scene.add(route);

// ---------- arches (gates 0.5, 1, 2, 3) ----------
const ARCH_Z = [-96, -121, -152, -180];
const arches = ARCH_Z.map(z => {
  const g = new THREE.Group(), mat = std(C.arch, { emissive: C.sky, emissiveIntensity: 0, roughness: .45 });
  const a = new THREE.Mesh(new THREE.TorusGeometry(3.4, .06, 12, 120, Math.PI), mat); a.castShadow = true; g.add(a);
  for (const s of [-1, 1]) { const f = new THREE.Mesh(new THREE.BoxGeometry(.55, .12, .55), mat); f.position.set(s * 3.4, .06, 0); f.castShadow = true; g.add(f); }
  g.position.z = z; scene.add(g); g.userData.mat = mat; return g;
});
function archGlow(i, k) { const m = arches[i].userData.mat; m.color.lerpColors(ARCHC, SKY, k); m.emissiveIntensity = k * .55; }

// ---------- hero: intent orb -> transaction tile ----------
const hero = new THREE.Group(); scene.add(hero);
const orb = new THREE.Mesh(new THREE.SphereGeometry(.55, 48, 32), glowM(C.sky, .45)); orb.castShadow = true; hero.add(orb);
const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture('82,136,194'), transparent: true, depthWrite: false })); hero.add(halo);
const tile = makeTile(C.sky4, .22); hero.add(tile);
const seal = new THREE.Mesh(new THREE.CylinderGeometry(.13, .13, .035, 32), std(C.ink)); seal.rotation.x = Math.PI / 2; seal.position.set(.6, -.36, .09); tile.add(seal);

// ---------- S1 intent ----------
const ripples = [0, 1, 2].map(() => { const r = flatRing(.7, .016, C.ink); r.position.set(0, .02, 0); scene.add(r); return r; });

// ---------- harness station (seen in 3D on approach, explained in 2D) ----------
const tunnel = new THREE.Group(); scene.add(tunnel);
const rings = [];
for (let i = 0; i < 5; i++) {
  const m = new THREE.Mesh(new THREE.TorusGeometry(1.5, .03, 10, 96), std(C.ring, { emissive: C.sky, emissiveIntensity: 0 }));
  m.castShadow = true;
  m.userData = { fin: V(0, 1.2, -26 - i * 2), st: V((R() - .5) * 18, 1 + R() * 8, -30 + (R() - .5) * 14), rs: [R() * 6, R() * 6, R() * 6], d: 4.4 + i * .16 };
  tunnel.add(m); rings.push(m);
}
const rails = [];
for (let k = 0; k < 6; k++) {
  const a = k / 6 * Math.PI * 2, c = new THREE.Mesh(new THREE.CylinderGeometry(.014, .014, 8, 6), std(0xc4c4cc, { transparent: true, opacity: .75 }));
  const pivot = new THREE.Group(); pivot.position.set(Math.cos(a) * 1.5, 1.2 + Math.sin(a) * 1.5, -26);
  c.rotation.x = Math.PI / 2; c.position.z = -4; pivot.add(c); tunnel.add(pivot); rails.push(pivot);
}
const model = edged(new THREE.IcosahedronGeometry(.55, 0), std(C.lilac, { flatShading: true }), 0x71717a, .6);
model.position.set(0, 3.95, -30); tunnel.add(model);
const wire = new THREE.Mesh(new THREE.CylinderGeometry(.014, .014, .7, 6), std(0xa1a1aa)); wire.position.set(0, 3.05, -30); tunnel.add(wire);

// ---------- gate 0.5 station: chain + fork laid along the route ----------
const forkG = new THREE.Group(); scene.add(forkG);
const cube = new THREE.BoxGeometry(1.2, 1.2, 1.2);
const MAIN_Z = [-82.6, -84.4, -86.2, -88.0];
MAIN_Z.forEach(z => { const b = edged(cube, std(0xffffff)); b.position.set(-1.6, .6, z); forkG.add(b); });
const slotM = new THREE.LineDashedMaterial({ color: C.ink, dashSize: .14, gapSize: .09, transparent: true, opacity: .55 });
const mainSlot = new THREE.LineSegments(new THREE.EdgesGeometry(cube), slotM); mainSlot.computeLineDistances(); mainSlot.position.set(-1.6, .6, -89.8); forkG.add(mainSlot);
const forkBlocks = [-86.2, -88.0].map(z => { const b = mark(edged(cube, std(C.lilac, { opacity: .8 }), C.ink, .7)); b.position.set(-1.6, .6, z); forkG.add(b); return b; });
const forkSlot = new THREE.LineSegments(new THREE.EdgesGeometry(cube), slotM.clone()); forkSlot.computeLineDistances(); forkSlot.position.set(-1.6, 3.4, -89.8); forkG.add(forkSlot);

// narrated film: VO_TL maps narrated time to the original film clock (piecewise linear) and carries subtitle cues
const TL = window.VO_TL || null, captionEl = document.getElementById('sub');
function oldTime(T) {

  return A[A.length - 1][1];
}
function seekFilm(T) {
