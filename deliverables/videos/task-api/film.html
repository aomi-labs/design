<title>Aomi Task API</title>
<!--
  "Aomi Task API" — opens on what it does: a treasury agent's intent goes through Aomi's harness, runs on an
  internal fork of Arc, and comes back as a signed outcome fingerprint; the buyer pays 3% of the USDC the bundle
  moves, over x402, then signs and broadcasts itself; then a real run on Arc Mainnet. Then why it matters: x402
  settles fair exchange over data but not over services; machine services are the output of data processing, so
  the outcome can be checked before delivery. Source: staging.aomi.dev/research/introducing-the-aomi-task-api.
  3D is drawn as isometric plinths with cubes (agent, harness, wallet, Arc) joined by pipes.
  Built on skills/slide-to-video/assets/film-template.html; the whole frame is a pure function of t.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

#gl,#labels,#hud,#veil,#vig,#flat{position:absolute;inset:0}

canvas{display:block}

.lbl{position:absolute;left:0;top:0;font:500 17px 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);white-space:nowrap;opacity:0}

#outro .url{font:500 22px 'Geist Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:30px;opacity:0}
#sub{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);max-width:1600px;text-align:center;font:500 34px/1.3 'Geist',sans-serif;color:#fff;background:rgba(9,9,11,.82);padding:10px 24px;border-radius:10px;opacity:0;white-space:nowrap}

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ---------- timeline ----------
// Scenes are authored on this clock; EDIT (below) plays the blocks in a different order: the title, then the
// Task API itself (S5–S9), then why it matters (S1–S4), then the thesis, trust and outro. The voice-over warps
// the playback clock (vo/script.mjs times are playback times).
//   0.0  S0  3D   title: Agent → Aomi harness → Wallet → Arc, as plinths and cubes
//   5.4  S1  2D   x402 over data: buyer, seller, the chain in between
//  13.6  S2  2D   the same triangle, buying a service: delivery and quality can't be enforced
//  21.4  S3  3D   a contractor, a house, one visit: was it a good job?
//  28.8  S4  2D   two loops: the human economy breaks (✗), the agent economy checks before paying
//  37.4  S5  2D   the Task API: one long intent, briefed the way agents brief subagents
//  48.4  S6  3D   harness builds the calls, runs the batch on an internal fork of Arc, checks every constraint
//  58.8  S7  2D   the outcome fingerprint (signed preview)
//  66.6  S8a 2D   the buyer decides, pays 3% over x402, receives the bundle
//  74.2  S8b 3D   the buyer's wallet signs; the block settles on Arc; Aomi holds no key, no funds
//  81.4  S9  2D   watch it live (slot for the screen recording)
//  89.4  S10 2D   transparent settlement + verifiable work = outcome-based pricing
//  93.0  S11 3D   the trust boundary: the harness cube is unverified (rose), then sealed in a glass TEE (green)
// 101.6  outro  3D   the trust scene's cubes line up along the mark's two rings, turn into black squares, and fuse into the logo
const W = 1920, H = 1080, DUR = 110, O = 101.6;
const EDIT = [[0, 5.4], [37.4, 89.4], [5.4, 17.6], [20.2, 27.7], [28.7, 35.4], [37.0, 37.4], [89.4, 110]]; // 35.4–37.0 is one lap of the loop dot // authored ranges, in playback order (static holds cut)
const PLAY_DUR = EDIT.reduce((s_, [a, b]) => s_ + b - a, 0);
const authorTime = x => { for (const [a, b] of EDIT) { if (x < b - a) return a + x; x -= b - a; } return DUR; };

// ---------- math ----------
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eout = x => 1 - Math.pow(1 - x, 3);
const eback = x => { const c1 = 1.70158, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const win = (t, a, b, f = .4) => Math.min(seg(t, a, a + f), 1 - seg(t, b - f, b));
const pulse = (t, a, b) => Math.sin(Math.PI * seg(t, a, b));
const tiny = s => Math.max(s, 1e-3);
const deg = THREE.MathUtils.degToRad;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function keyed(keys, t) {
  if (t <= keys[0][0]) return keys[0][1].slice();
  for (let i = 0; i < keys.length - 1; i++) { const [a, pa] = keys[i], [b, pb] = keys[i + 1]; if (t <= b) { const x = eio(seg(t, a, b)); return pa.map((v, j) => lerp(v, pb[j], x)); } }
  return keys[keys.length - 1][1].slice();
}
// a point at fraction u along a polyline [[x, y], …]
function polyAt(pts, u) {
  const lens = pts.slice(1).map((p, i) => Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1])), tot = lens.reduce((a, b) => a + b, 0);
  let d = cl(u) * tot; for (let i = 0; i < lens.length; i++) { if (d <= lens[i] || i === lens.length - 1) { const f = lens[i] ? d / lens[i] : 0; return [lerp(pts[i][0], pts[i + 1][0], f), lerp(pts[i][1], pts[i + 1][1], f)]; } d -= lens[i]; }
}

// ---------- palette (3D structure is grey; sky = passed / ours, rose = failed, amber = skipped) ----------
const C = { paper: 0xffffff, ink: 0x09090b, sky: 0x5288c2, sky4: 0x7facd6, rose: 0xdf5d90, amber: 0xd9982b, arch: 0x9d9da8, track: 0xa1a1aa, block: 0xe4e4e7, cool2: 0xe4e4e7, grey: 0xc9c9d1 };
const SKY = new THREE.Color(C.sky), ARCHC = new THREE.Color(C.arch), GLASS = new THREE.Color(0xcfe1f3);

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('gl').appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(C.paper); scene.fog = new THREE.Fog(C.paper, 30, 95);
const camera = new THREE.PerspectiveCamera(35, W / H, .1, 2000);
scene.add(new THREE.HemisphereLight(0xffffff, 0xece4e2, 1.25));
const sun = new THREE.DirectionalLight(0xffffff, 1.7); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 120 }); sun.shadow.bias = -.0005; sun.shadow.radius = 5;
scene.add(sun, sun.target);

// ---------- factories ----------
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .55, metalness: 0, ...o });
const glowM = (color, ei = .35, o = {}) => std(color, { emissive: color, emissiveIntensity: ei, ...o });
const lineM = (color = C.ink, op = 1) => new THREE.LineBasicMaterial({ color, transparent: true, opacity: op });
function edged(geo, mat, lcol = C.ink, lop = .8) { const m = new THREE.Mesh(geo, mat); m.castShadow = m.receiveShadow = true; m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25), lineM(lcol, lop))); return m; }
function glowTexture(rgb) {
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, `rgba(${rgb},.5)`); gr.addColorStop(.5, `rgba(${rgb},.14)`); gr.addColorStop(1, `rgba(${rgb},0)`); g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; return tx;
}
// isometric-style stations: a grey plinth with a cube on it, and pale-blue pipes between them
const PIPE = 0x9dbbe0;
function plinth(w = 2.2, d = 2.2) { const m = edged(new RoundedBoxGeometry(w, .45, d, 3, .06), std(0xe4e4e7), 0xb4b4bf, .9); m.position.y = .225; return m; }
function glyphTex(kind, ink) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 256; const g = cv.getContext('2d'); g.strokeStyle = g.fillStyle = ink; g.lineCap = g.lineJoin = 'round';
  const star = (x, y, r) => { g.beginPath(); g.moveTo(x, y - r); g.quadraticCurveTo(x, y, x + r * .55, y); g.quadraticCurveTo(x, y, x, y + r); g.quadraticCurveTo(x, y, x - r * .55, y); g.quadraticCurveTo(x, y, x, y - r); g.fill(); };
  if (kind === 'agent') { star(128, 128, 62); }
  if (kind === 'term') { g.lineWidth = 16; g.beginPath(); g.moveTo(70, 92); g.lineTo(112, 128); g.lineTo(70, 164); g.stroke(); g.beginPath(); g.moveTo(130, 172); g.lineTo(186, 172); g.stroke(); }
  if (kind === 'arc') { g.font = "700 64px 'Geist Mono'"; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('ARC', 128, 132); }
  const tx = new THREE.CanvasTexture(cv); tx.colorSpace = THREE.SRGBColorSpace; tx.userData = { cv, kind, ink }; GLYPHS.push(tx); return tx;
}
const GLYPHS = [];
function cube(kind, color, size = 1.3, ink = '#1f3a63', ei = .1) {
  const g = new THREE.Group(), body = edged(new RoundedBoxGeometry(size, size, size, 4, size * .11), glowM(color, ei, { roughness: .45 }), 0xb4b4bf, kind === 'term' ? 0 : .5);
  g.add(body); g.userData.body = body;
  if (kind) { const tx = glyphTex(kind, ink), pg = new THREE.PlaneGeometry(size * .8, size * .8);
    [[0, 1], [Math.PI / 2, 1], [Math.PI, 1], [-Math.PI / 2, 1]].forEach(([ry]) => { const pl = new THREE.Mesh(pg, new THREE.MeshBasicMaterial({ map: tx, transparent: true, depthWrite: false }));
      pl.position.set(Math.sin(ry) * (size / 2 + .006), 0, Math.cos(ry) * (size / 2 + .006)); pl.rotation.y = ry; g.add(pl); }); }
  return g;
}
function pipe(pts, r = .07) { const m = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(p => V(...p)), false, 'catmullrom', .05), 80, r, 12, false), std(PIPE, { roughness: .35 })); m.castShadow = true; scene.add(m); return m; }
function walletSlab() { const g = new THREE.Group(); g.add(edged(new RoundedBoxGeometry(1.5, .78, 1.0, 3, .12), std(0xe9e9ec), 0xb4b4bf, .6));
  const b = new THREE.Mesh(new RoundedBoxGeometry(.42, .2, .08, 2, .04), glowM(C.sky, .15)); b.position.set(.42, .02, .52); g.add(b); g.userData.button = b;
  const b2 = b.clone(); b2.material = b.material; b2.rotation.y = Math.PI / 2; b2.position.set(.77, .02, -.2); g.add(b2); return g; }
const STATIONS = []; // [group, visible from, visible to] on the authoring clock
function station(x, z, a, b, w, d) { const g = new THREE.Group(); g.position.set(x, 0, z); g.add(plinth(w, d)); scene.add(g); STATIONS.push([g, a, b]); return g; }

// the bundle card: a banknote with "$" — the transactions Aomi builds for the buyer
const ICON_INK = { [C.sky4]: '#1f3a63', [C.sky]: '#ffffff', [C.grey]: '#3f3f46', [0x9ad8bb]: '#14532d' };
const iconGeo = new THREE.PlaneGeometry(1.5, .95), iconCache = new Map(), tileGeo = new RoundedBoxGeometry(1.5, .95, .14, 4, .1);
function drawIcon(cv, ink) {
  const g = cv.getContext('2d'); g.clearRect(0, 0, 600, 380); g.strokeStyle = g.fillStyle = ink; g.lineWidth = 15; g.lineCap = 'round';
  g.beginPath(); g.roundRect(95, 72, 410, 236, 22); g.stroke(); g.font = "600 150px 'Geist'"; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('$', 300, 200);
  g.beginPath(); g.moveTo(410, 118); g.lineTo(460, 118); g.moveTo(140, 262); g.lineTo(190, 262); g.stroke();
}
function iconTex(color) {
  if (!iconCache.has(color)) { const cv = document.createElement('canvas'); cv.width = 600; cv.height = 380; const ink = ICON_INK[color] || '#09090b'; drawIcon(cv, ink);
    const tx = new THREE.CanvasTexture(cv); tx.colorSpace = THREE.SRGBColorSpace; iconCache.set(color, { cv, tx, ink }); }
  return iconCache.get(color).tx;
}
function makeCard(base = C.sky4) {
  const g = new THREE.Group(), body = new THREE.Mesh(tileGeo, glowM(base, .22)); body.castShadow = true; g.add(body);
  const planes = [.075, -.075].map((z, k) => { const pl = new THREE.Mesh(iconGeo, new THREE.MeshBasicMaterial({ map: iconTex(base), transparent: true, depthWrite: false })); pl.position.z = z; pl.rotation.y = k ? Math.PI : 0; g.add(pl); return pl; });
  let cur = base;
  g.userData.set = color => { if (color === cur) return; cur = color; body.material.color.setHex(color); body.material.emissive.setHex(color); planes.forEach(p => { p.material.map = iconTex(color); }); };
  return g;
}

// ---------- world ----------
const floor = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.ShadowMaterial({ opacity: .09 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
