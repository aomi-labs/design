<title>From Intent to Execution</title>
<!--
  "From intent to execution" — the execution half of the EasyCon (EVM) and Breakpoint (Solana) decks.
  A person asks an AI for a real DeFi action, on Ethereum and on Solana. The same model runs it twice,
  side by side: Claude Code alone, and Claude through Aomi. Every detour in Claude's own log drops a
  rose "capability defect" pill into a rail; each pill turns sky at the step of the harness that fixes it.
  The Claude-alone logs come from a recorded headless run (research/), held in RUN below.
  Built on skills/slide-to-video/assets/film-template.html; the whole frame is a pure function of t.
-->

#chat .hd{display:flex;justify-content:space-between;font:500 16px 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:22px}

#chat .sent{font:500 15px 'Geist Mono',monospace;color:var(--muted);text-align:right;margin-top:6px;opacity:0}

.dp{position:absolute;left:0;top:0;box-sizing:border-box;height:34px;line-height:31px;padding:0 12px;text-align:center;white-space:nowrap;font:500 15px 'Geist Mono',monospace;color:var(--rose);background:#fdf2f7;border:1.5px dashed var(--rose);border-radius:999px;opacity:0}

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ---------- the two runs, side by side ----------
// Log lines: [kind, text, counters?, pill?]. Claude Code (terminal) kinds: text · call · res · err · ask · ans.
// Aomi kinds: ok · chip · note · done. Counters: c tool calls, a questions to you, s simulations, g signatures.
// PLACEHOLDER: the Claude-alone columns are reconstructed until research/claude-no-harness-*.md lands;
// then replace them with the recorded lines (trimmed, never invented) and the recorded counters.
const RUN = {
  evm: {

    claude: [

      ['call', 'Bash(npx tsx stake-and-borrow.ts)', { c: 1, g: 2 }],
      ['res', 'stake 0x4c1e…9a02 ✓  approve 0x77d0…c1f3 ✓'],
      ['err', 'Error: supply reverted: execution reverted: 27', null, 5],
      ['call', 'Web Search("aave v3 error code 27")', { c: 1 }],
      ['res', 'Did 1 search in 3s'],
      ['text', 'Error 27 is RESERVE_INACTIVE: Aave v3 lists wstETH, not stETH. I need to wrap first.'],
      ['call', 'Update(stake-and-borrow.ts)', { c: 1 }],
      ['res', 'Updated stake-and-borrow.ts with 18 additions and 4 removals'],
      ['ask', 'To send the remaining transactions I need a signer. Add PRIVATE_KEY to .env?', { a: 1 }, 6],
      ['ans', 'done'],
      ['call', 'Bash(npx tsx stake-and-borrow.ts --send)', { c: 1, g: 4 }, 4],
      ['res', 'wrap ✓  approve ✓  supply ✓  borrow ✓  (4 txs sent)'],

    aomi: [

      ['ok', 'Simulate Lido stake of 5 ETH', { c: 1, s: 1 }], ['chip', '5 ETH → ~5 stETH · ~4.0297 wstETH'],
      ['note', 'All context checks pass: 1000 USDC against ~4.03 wstETH is within safe LTV.', { c: 1 }],
      ['ok', 'Stage stake → wrap → supply → borrow', { c: 1 }], ['chip', 'stake · approve · wrap · approve · supply · borrow'],
      ['ok', 'Simulate full 6-tx flow', { c: 1, s: 1 }], ['chip', 'all 6 pass · gas 1.04 gwei'],
      ['done', '6 transactions → 1 bundle → sign', { g: 1 }]],
    goal: ['reached, unverified', 'reached, verified'],

  sandboxFail: { evm: 'revert 27 → decoded: stETH isn’t an Aave reserve', sol: 'ReserveStale → decoded: refresh the reserve first' },
  readCallback: [['call', 'Web Search("Lido stETH contract address…")'], ['call', 'Fetch(https://docs.lido.fi/deployed-contracts)'], ['call', 'Web Search("Aave v3 Pool contract address…")'], ['err', 'Missing/Invalid API Key'], ['text', 'Can you add ETHERSCAN_API_KEY and RPC_URL to .env?'], ['text', "I'll write the minimal ABI fragments by hand."]],
};

// ---------- timeline (silent film clock; the voice-over warps it later) ----------
//   0.0  F1-2 3D   a person asks an AI, on Ethereum and on Solana; each message becomes an orb, then a card
//  11.4  F3-4 2D   Ethereum: Claude alone | Claude through Aomi — logs side by side; defects drop into the rail
//  33.0  F5   2D   Solana: the same
//  51.0  F6   2D   why a harness: performance · token efficiency · security
//  55.0  F7   2D   the harness loop: the Aomi log lines slot into read → write → rehearse → commit
//  62.0  F8   2D   read                      (fixes: keys, contract DB, ABI/IDL)
//  70.0  F9   2D   write                     (fix: protocol rules)
//  77.4  F10a 3D   the sandbox catches Claude's own failures
//  85.0  F10b 2D   a chain fork is CI for transactions — two loops running (fixes: simulation, raw errors)
//  97.4  F10c 3D   both cards pass
// 101.0  F11-12 2D one unit, one exit, then your wallet  (fix: key in .env)
// 114.6  F13  3D   settle, and the result is checked   (fix: verification)
// 121.2  F14  2D   the three points again: the fixed pills sort under them
// 126.2  F15  2D   who does what
// 129.0  outro
const W = 1920, H = 1080, DUR = 135, O = 129;

// ---------- math ----------
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eout = x => 1 - Math.pow(1 - x, 3);
const eback = x => { const c1 = 1.70158, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const win = (t, a, b, f = .4) => Math.min(seg(t, a, a + f), 1 - seg(t, b - f, b));
const pulse = (t, a, b) => Math.sin(Math.PI * seg(t, a, b));
const tiny = s => Math.max(s, 1e-3);
const deg = THREE.MathUtils.degToRad;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function keyed(keys, t) {
  if (t <= keys[0][0]) return keys[0][1].slice();
  for (let i = 0; i < keys.length - 1; i++) { const [a, pa] = keys[i], [b, pb] = keys[i + 1]; if (t <= b) { const x = eio(seg(t, a, b)); return pa.map((v, j) => lerp(v, pb[j], x)); } }
  return keys[keys.length - 1][1].slice();
}

// ---------- palette ----------
const C = { grn: 0x2e9e6b, grn4: 0x9ad8bb, paper: 0xffffff, ink: 0x09090b, sky: 0x5288c2, sky4: 0x7facd6, rose: 0xdf5d90, arch: 0x9d9da8, track: 0xa1a1aa, block: 0xe4e4e7, cool2: 0xe4e4e7 };
const SKY = new THREE.Color(C.sky), ARCHC = new THREE.Color(C.arch), ROSE = new THREE.Color(C.rose), GLASS = new THREE.Color(0xcfe1f3);

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('gl').appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(C.paper); scene.fog = new THREE.Fog(C.paper, 30, 95);
const camera = new THREE.PerspectiveCamera(35, W / H, .1, 2000);
scene.add(new THREE.HemisphereLight(0xffffff, 0xece4e2, 1.25));
const sun = new THREE.DirectionalLight(0xffffff, 1.7); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 120 }); sun.shadow.bias = -.0005; sun.shadow.radius = 5;
scene.add(sun, sun.target);

// ---------- factories ----------
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .55, metalness: 0, ...o });
const glowM = (color, ei = .35, o = {}) => std(color, { emissive: color, emissiveIntensity: ei, ...o });
const lineM = (color = C.ink, op = 1) => new THREE.LineBasicMaterial({ color, transparent: true, opacity: op });
function edged(geo, mat, lcol = C.ink, lop = .8) { const m = new THREE.Mesh(geo, mat); m.castShadow = m.receiveShadow = true; m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25), lineM(lcol, lop))); return m; }
function glowTexture(rgb) {
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, `rgba(${rgb},.5)`); gr.addColorStop(.5, `rgba(${rgb},.14)`); gr.addColorStop(1, `rgba(${rgb},0)`); g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; return tx;
}
// the hero cards: a banknote with the chain's asset on it — ETH on the EVM lane, SOL on the Solana lane
const ICON_INK = { [C.sky4]: '#1f3a63', [C.sky]: '#ffffff', [C.rose]: '#6e1c3d', [C.grn4]: '#14532d', [C.grn]: '#ffffff' };
const iconGeo = new THREE.PlaneGeometry(1.5, .95), iconCache = new Map(), tileGeo = new RoundedBoxGeometry(1.5, .95, .14, 4, .1);
function drawIcon(cv, ink, sym) {
  const g = cv.getContext('2d'); g.clearRect(0, 0, 600, 380); g.strokeStyle = g.fillStyle = ink; g.lineWidth = 15; g.lineCap = 'round';
  g.beginPath(); g.roundRect(95, 72, 410, 236, 22); g.stroke(); g.font = "600 112px 'Geist'"; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(sym, 300, 196);
  g.beginPath(); g.moveTo(410, 112); g.lineTo(460, 112); g.moveTo(140, 268); g.lineTo(190, 268); g.stroke();
}
function iconTex(color, sym) {
  const key = color + sym;
  if (!iconCache.has(key)) { const cv = document.createElement('canvas'); cv.width = 600; cv.height = 380; const ink = ICON_INK[color] || '#09090b'; drawIcon(cv, ink, sym);
    const tx = new THREE.CanvasTexture(cv); tx.colorSpace = THREE.SRGBColorSpace; iconCache.set(key, { cv, tx, ink, sym }); }
  return iconCache.get(key).tx;
}

const tmp = V(0, 0, 0);

  lanes.forEach(l => { const bs = eback(seg(t, l.born, l.born + .9)) * (1 - eio(seg(t, 9.8, 10.3))), ph = l.s * 1.7;
